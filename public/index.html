<div class="modalback" id="modal"><form class="modal" id="form"><h2 id="addTitle">Добавить событие</h2><p class="modal-intro" id="addIntro">Создайте дежурство или зафиксируйте отсутствие.</p><div class="add-switch"><button type="button" class="on" data-add-mode="duty">Дежурство</button><button type="button" data-add-mode="absence">Отсутствие</button></div><section class="add-panel" id="dutyFields"><div class="field"><label>Тип дежурства</label><select name="kind"><option value="office">Офисное дежурство</option><option value="support">Поддержка в выходной</option><option value="holiday">Поддержка в праздник</option></select></div><div class="field"><label>Сотрудник</label><select name="employee_id" id="employee"></select><div class="employee-preview" id="dutyEmployeePreview"></div></div><div class="field"><label>Начало</label><input type="date" name="starts_on" required></div><div class="field"><label>Окончание</label><input type="date" name="ends_on" required></div><div class="field"><label>Компенсация, часов</label><input name="hours" type="number" min="0.5" max="4" step="0.5" placeholder="Автоматически: 2 или 4"></div><div class="field"><label>Учёт</label><select name="accounting_mode"><option value="schedule">По графику — баланс не меняется</option><option value="compensate">Компенсация — изменить баланс</option></select></div></section><section class="add-panel" id="absenceFields" hidden><div class="field"><label>Сотрудник</label><select name="employee_id" id="absenceEmployee" disabled></select><div class="employee-preview" id="absenceEmployeePreview"></div></div><div class="field"><label>Тип отсутствия</label><select name="absence_type" disabled><option value="personal">Личное отсутствие</option><option value="time_off">Отгул</option><option value="vacation">Отпуск</option><option value="sick_leave">Больничный</option><option value="business_trip">Командировка</option><option value="unpaid_leave">Без содержания</option><option value="other">Другое</option></select></div><div class="field"><label>Начало отсутствия</label><input type="date" name="occurred_on" disabled></div><div class="field"><label>Окончание отсутствия</label><input type="date" name="ends_on" disabled></div><div class="field"><label>Часов отсутствия в день</label><input name="hours" type="number" min="0.5" max="24" step="0.5" disabled></div><div class="field"><label>Комментарий</label><textarea name="note" placeholder="Причина или договорённость" disabled></textarea></div><div class="field check-field"><label><input type="checkbox" name="compensable" checked disabled> Учитывать в балансе</label></div></section><div class="modal-actions"><button type="button" class="button" id="close">Отмена</button><button type="submit" class="button primary" id="addSubmit">Добавить</button></div></form></div><div class="toast" id="toast"></div><script src="https://api.bitrix24.com/api/v1/"></script><script src="/app.js"></script></body></html>
