<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Установка — Дежурства</title>
  <style>
    body{margin:0;display:grid;place-items:center;min-height:100vh;background:#f5f7fb;font:15px Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17223b}
    .card{width:min(520px,calc(100% - 40px));box-sizing:border-box;background:#fff;padding:30px;border:1px solid #e2e8f2;border-radius:16px;box-shadow:0 12px 34px #253b6a18;text-align:center}
    .mark{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 14px;border-radius:14px;background:#eaf0ff;color:#3568e8;font-size:25px;font-weight:800}
    h2{margin:0 0 7px}.sub{margin:0;color:#71809a;line-height:1.55}.error{color:#b94545}.done .mark{background:#e9f7f0;color:#18805f}
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="mark" id="mark">…</div>
    <h2 id="title">Подготавливаем приложение</h2>
    <p class="sub" id="status">Создаём защищённое хранилище в универсальных списках Битрикс24.</p>
  </div>
  <script src="https://api.bitrix24.com/api/v1/"></script>
  <script src="./bitrix-static.js"></script>
  <script>
    BX24.init(async function () {
      const card=document.getElementById('card'),mark=document.getElementById('mark'),title=document.getElementById('title'),status=document.getElementById('status');
      try {
        await DutyStaticStore.install();
        card.classList.add('done');mark.textContent='✓';title.textContent='Дежурства установлены';status.textContent='Хранилище создано внутри Битрикс24. Завершаем установку…';
        BX24.installFinish();
      } catch (error) {
        mark.textContent='!';title.textContent='Установка не завершена';status.classList.add('error');status.textContent=error.message||'Не удалось подготовить хранилище.';
      }
    });
  </script>
</body>
</html>
