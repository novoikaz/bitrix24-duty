services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_PATH: /app/data/duty.sqlite
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - duty_data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  duty_data:
  caddy_data:
  caddy_config:
